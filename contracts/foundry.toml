[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const", "asm-keccak256"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bot_mainnet = "https://rpc.botchain.ai"
bot_testnet = "https://rpc.bohr.life"
